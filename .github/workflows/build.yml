name: Build and publish feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: feed-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper dependencies
        run: pip install -r requirements.txt
      - name: Generate source RSS feeds
        run: python scripts/generate_html_feeds.py
      - name: Serve generated feeds locally for Osmosfeed
        run: |
          python -m http.server 8765 --directory docs > /tmp/feed-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/generated-feeds/opovo.xml >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/generated-feeds/opovo.xml >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm ci
      - name: Build Osmosfeed CLI
        run: npm run build -w packages/cli
      - name: Generate dashboard
        run: npx osmosfeed
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            git add docs/
            git commit -m "chore: update generated feeds"
            git push
          else
            echo "No generated changes"
          fi
