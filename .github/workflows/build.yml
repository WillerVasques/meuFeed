name: Build and publish feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper dependencies
        run: pip install -r requirements.txt
      - name: Generate source RSS feeds
        run: python scripts/generate_html_feeds.py
      - name: Serve generated feeds locally for Osmosfeed
        run: |
          python -m http.server 8765 --directory docs > /tmp/feed-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/generated-feeds/opovo.xml >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/generated-feeds/opovo.xml >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm ci
      - name: Build Osmosfeed CLI
        run: npm run build -w packages/cli
      - name: Generate dashboard
        run: npx osmosfeed
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
